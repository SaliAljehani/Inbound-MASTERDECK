<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbound Call Center Master Deck 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D9444A; --red-bg:#FDECEC; --navy:#4A6188; --navy-bg:#E8F0FA;
  --green:#127A4B; --green-bg:#E3F4EC; --amber:#9A6200; --amber-bg:#FFF3DC;
  --gray-bg:#F1F1F1; --text:#1E2430; --muted:#6B7280; --line:#E5E7EB; --card:#FFFFFF; --page:#F6F7F9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 40px}
.topbar{height:6px;background:var(--red)}
h1,h2,h3{font-family:'Crimson Pro',Georgia,serif;color:var(--navy);margin:0}
header{position:relative;text-align:center;padding:22px 130px 12px}
header .logo{position:absolute;right:0;top:16px}
@media(max-width:700px){header{padding:18px 0 8px}header .logo{position:static;display:block;margin:8px auto 0}}
.eyebrow{color:var(--muted);font-family:'Crimson Pro',serif;font-size:18px}
h1{font-size:32px;font-weight:700;line-height:1.1}
.logo{height:46px}
.logo-txt{font-weight:800;font-style:italic;color:var(--red);font-size:24px;letter-spacing:.5px}
.filters{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.filters .group{flex-wrap:wrap;justify-content:center}
#monthGroup .pill{padding:8px 13px;font-size:13px}
#viewGroup{border-radius:20px}#viewGroup .pill{border-radius:16px;padding:6px 18px}
#viewGroup .pill.on{background:var(--navy)}
.group{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.pill{border:0;background:transparent;padding:7px 14px;border-radius:7px;font:inherit;font-size:13px;color:var(--text);cursor:pointer}
.pill:hover{background:var(--gray-bg)}
.pill.on{background:var(--red);color:#fff}
.pill .d{font-size:11px;opacity:.75;margin-left:4px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.half{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:20px;margin-bottom:10px}
.kpi .lbl{color:var(--muted);font-size:12px}
.kpi .val{font-size:26px;font-weight:600;color:var(--navy);margin:2px 0}
.kpi .dlt{font-size:12px;color:var(--muted)}
.up{color:var(--green)!important}.down{color:var(--red)!important}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.head h2{margin:0}
#tableTitle{display:none}
.head:has(#tabs:empty){display:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:7px;font:inherit;font-size:12px;cursor:pointer}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th{font-family:'Crimson Pro',serif;font-size:15px;color:var(--navy);font-weight:700;padding:10px 6px;text-align:center;border-bottom:2px solid var(--navy)}
td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td:first-child{font-family:'Crimson Pro',serif;font-size:15px;font-weight:700;color:#3a4458}
tr:nth-child(even) td{background:#FAFAFB}
th.wa{background:#F1F1F1;color:var(--navy)}
.bad{color:var(--red);font-weight:600}.good{color:var(--green);font-weight:600}
.box{border-radius:12px;padding:16px;min-height:120px}
.box h2{font-size:20px;margin-bottom:8px}
.box ul{margin:0;padding-left:18px;line-height:1.8;color:var(--navy)}
.mt14{margin-top:14px}
.ins{background:var(--navy-bg)}.ins h2{color:var(--navy)}
.chl{background:#F1F1F1}.chl h2{color:var(--navy)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;background:var(--gray-bg);color:var(--navy)}
.b-prog{background:var(--amber-bg);color:var(--amber)}.b-done{background:var(--green-bg);color:var(--green)}.b-late{background:var(--red-bg);color:var(--red)}
.empty{color:var(--muted);font-size:13px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bars .row{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bars .track{background:var(--gray-bg);border-radius:4px;height:12px}
.bars .fill{background:var(--navy);height:12px;border-radius:4px}
svg text{font-family:Inter,sans-serif;font-size:9.5px;fill:var(--muted)}
.wbar{cursor:pointer}
.status{font-size:12px;color:var(--muted);text-align:right;margin-top:10px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.half{grid-template-columns:1fr}h1{font-size:26px}}
.mtable tr.band td{font-family:'Crimson Pro',serif;font-size:16px;font-weight:700;padding:7px 10px;text-align:left}
.band-calls td{background:#F1F1F1!important;color:#4A6188}
.band-wa td{background:#F1F1F1!important;color:#4A6188}
.band-tb td{background:#F1F1F1!important;color:#4A6188}
.band-cx td{background:#F1F1F1!important;color:#4A6188}

/* ===== compact sizes + very light lines + table style E ===== */
:root{--line:#EFF1F4}
body{font-size:13px}
h1{font-size:26px}
header{padding:32px 130px 12px}
header .logo{top:26px}
.logo{height:40px}
.card{border-color:#EEF0F3;padding:14px}
.card h2,.box h2{font-size:17px}
.kpi .val{font-size:22px}
.kpi .lbl,.kpi .dlt{font-size:11.5px}
#monthGroup .pill{padding:7px 12px;font-size:12px}
#viewGroup .pill{padding:5px 16px;font-size:12px}
#weekGroup .pill{font-size:12px;padding:6px 12px}
.filters{border-bottom-color:#EFF1F4}
.grid{gap:12px;margin-bottom:12px}
.bars .row{font-size:12px;margin:6px 0}
.box{padding:14px;min-height:0}
.box ul{font-size:12.5px;line-height:1.7}
.status{font-size:11px}
table{font-size:12px}
tr:nth-child(even) td{background:transparent}
td{padding:7px 6px;border-bottom:1px solid #F1F3F5}
td:first-child{font-size:13px;color:#33405A}
table tr:first-child th{background:#F3F4F6;color:var(--red);border-bottom:0;font-family:Inter,sans-serif;font-size:12px;font-weight:700;padding:9px 6px}
table tr:first-child th:first-child{border-radius:8px 0 0 8px}
table tr:first-child th:last-child{border-radius:0 8px 8px 0}
th.wa{background:#F3F4F6!important;color:var(--red)!important}
.mtable tr.band td{background:#fff!important;color:var(--navy);font-family:'Crimson Pro',serif;font-size:15px;font-weight:700;padding:14px 8px 5px;border-bottom:1px solid #DCE3EC}
.mtable tr.band td::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:1px}
#panelTabs{display:flex;gap:6px;margin:0 0 10px}
#panelTabs .tab{font-size:12px;padding:6px 14px}
@media(max-width:900px){h1{font-size:22px}}

/* ===== one font everywhere: Times New Roman (Tinos = identical web copy) ===== */
body,h1,h2,h3,th,td,td:first-child,.pill,.tab,.mtable tr.band td,svg text,button,.kpi .val,table tr:first-child th{font-family:'Times New Roman',Tinos,Times,serif!important}
body{font-size:14px} table{font-size:13.5px} td:first-child{font-size:14px;font-weight:700} table tr:first-child th{font-size:14px}
.kpi .val{font-size:25px;font-weight:700}.kpi .lbl,.kpi .dlt{font-size:13px} .pill,.tab{font-size:13.5px!important} h1{font-size:30px} .card h2,.box h2{font-size:19px}
.mtable tr.band td{font-size:16px} svg text{font-size:11px} .bars .row{font-size:13px} .box ul{font-size:14px} .status{font-size:12px}

.monthmode{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
.monthmode>.card:first-child{order:2}
.tvc-row{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.tvc-bars{display:flex;flex-direction:column;gap:3px}
.tvc-bars .tb{height:11px;border-radius:3px;position:relative}
.tvc-bars .tb span{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:6px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tvc-p{font-weight:700;text-align:right;color:var(--red)}
</style>
</head>

    <div class="group" id="monthGroup"></div>
    <div class="group" id="viewGroup">
      <button class="pill" data-v="week">Weekly</button>
      <button class="pill on" data-v="month">Monthly</button>
    </div>
    <div class="group" id="weekGroup"></div>
  </div>

  <div class="grid kpis" id="kpis"></div>

  <div class="grid two" id="chartsRow">
    <div class="card"><h2 id="chartTitle">Calls vs WhatsApp by week</h2><div id="chart"></div></div>
    <div class="card"><h2 id="csatTitle">CSAT by campaign</h2><div class="bars" id="csat"></div></div>
  </div>

  <div id="panelTabs">
    <button class="tab on" data-p="summary">Campaigns Summary</button>
    <button class="tab" data-p="insights">Insights &amp; Projects</button>
  </div>
  <div class="card" id="tableCard" style="margin-bottom:14px">
    <div class="head"><h2 id="tableTitle">Campaigns</h2><div class="tabs" id="tabs"></div></div>
    <div class="tbl-wrap" id="table"></div>
  </div>

  <div id="monthlyOnly" style="display:none">
    <div class="grid half" id="notesWrap">
      <div class="box ins"><h2>Key Insights</h2><div id="insights"></div></div>
      <div class="box chl"><h2>Challenges</h2><div id="challenges"></div></div>
    </div>
    <div class="card" id="projectsWrap">
      <h2>Projects in Pipeline</h2>
      <div class="tbl-wrap" id="projects"></div>
    </div>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
/* ================= SETTINGS ================= */
const CONFIG = {
  // Apps Script web app (reads the private sheet and returns a tab as JSON)
  API: 'https://script.google.com/macros/s/AKfycbz2xGcy0I_hQjLLfn7d-vNQV7TTxaGOptJrhuYr0aSMtHhAUyQVj2KcMHzbTISvNNv_oQ/exec',
  WEEKLY_TAB: 'Weekly MASTERDECK',
  MONTHLY_TAB: 'Monthly MASTERDECK',
  INSIGHTS_TAB: 'Insights',
  PROJECTS_TAB: 'Projects',
  YEAR: 2026,
  MONTHS: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  ALWAYS_SHOW: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],   // months that always have a button
  _unused: ''
};
const MONTH_NAMES = {Jan:'January',Feb:'February',Mar:'March',Apr:'April',May:'May',Jun:'June',Jul:'July',Aug:'August',Sep:'September',Oct:'October',Nov:'November',Dec:'December'};

/* Monthly table tabs: which sheet columns go under which tab (matched by header, ignoring spaces/symbols) */
const MONTH_GROUPS = [
  ['Calls',               ['callsvolume','sl','asa','abandonedrate','avgaht','avgacw']],
  ['WhatsApp',            ['whatsappvolume','avgfirstrt','avgrt','abandon','reconnected']],
  ['Tickets & Bookings',  ['tickets','ticketsvscalls','booking','bookings']],
  ['Customer Experience', ['csat']]
];
const WA_START = 'whatsappvolume';   // weekly table: this column and after are WhatsApp (green header)

/* ================= HELPERS ================= */
const key = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const txt = v => String(v==null?'':v).trim();
function num(v){ const s=txt(v).replace(/[,%\s]/g,''); if(!s||s==='-'||s==='–') return null; const n=Number(s); return isNaN(n)?null:n; }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function monthKey(s){ const k=key(s); if(k.length<3) return ''; return Object.keys(MONTH_NAMES).find(m=>k.startsWith(m.toLowerCase()))||''; }
const show = v => { const s=txt(v); return s===''?'':esc(s); };      // exactly as written in the sheet
const weekDates = w => txt(w).replace(/^week\s*/i,'');
const blank = v => { const s=txt(v); return s===''||s==='-'||s==='–'||s==='%'; };

/* ================= PARSE: Weekly MASTERDECK =================
   Months side by side. In each month: repeated blocks of
   "Weekly Inbound Summary" / "Week 1-8" / header row (Campaign | Calls Volume | …) / one row per campaign. */
/* ================= PARSE: Weekly MASTERDECK =================
   Row 1 = headers. Each month is a block of columns that starts with a "Week" column
   (month name in the column before it). Column A = campaign (merged over its week rows).
   Every row with a week name ("Week 1-8") is one campaign in that week. */
function parseWeekly(g){
  const out=[]; if(!Array.isArray(g)||!g.length) return out;
  const head=g[0];
  const wcs=head.map((h,i)=>key(h)==='week'?i:-1).filter(i=>i>=0);
  wcs.forEach((wc,bi)=>{
    const end = bi+1<wcs.length ? wcs[bi+1]-1 : head.length;
    let month=''; for(let r=0;r<g.length&&!month;r++) month=monthKey(g[r][wc-1]);
    if(!month) return;
    const cols=[]; for(let c=wc+1;c<end;c++) if(txt(head[c])) cols.push({c,label:txt(head[c]),k:key(head[c])});
    const weeks=[], byLabel={}; let campaign='';
    for(let r=1;r<g.length;r++){
      const a=txt(g[r][0]), wk=txt(g[r][wc]);
      if(a&&key(a)!=='total') campaign=a;
      if(key(a)==='total'||!campaign||!/^week/i.test(wk)) continue;
      const lk=key(wk);
      if(!byLabel[lk]){ byLabel[lk]={month,week:wk,cols,rows:[]}; weeks.push(byLabel[lk]); }
      byLabel[lk].rows.push({campaign,cells:cols.map(x=>g[r][x.c])});
    }
    weeks.forEach(w=>{ w.hasData=w.rows.some(x=>x.cells.some(v=>!blank(v))); out.push(w); });
  });
  return out;
}

/* ================= PARSE: Monthly MASTERDECK =================
   Months stacked under each other. Each month = a header row (Calls Volume, SL %, …),
   then one row per campaign (name in column A). Month name sits in column B (merged). */
function parseMonthly(g){
  const out={}; if(!Array.isArray(g)||!g.length) return out;
  const isHead=r=>(g[r]||[]).some(c=>key(c)==='callsvolume');
  const heads=[]; for(let r=0;r<g.length;r++) if(isHead(r)) heads.push(r);
  heads.forEach((hr,hi)=>{
    const next = hi+1<heads.length ? heads[hi+1] : g.length;
    let month=''; for(let r=hr;r<next&&!month;r++) for(let c=0;c<Math.min(3,(g[r]||[]).length)&&!month;c++) month=monthKey(g[r][c]);
    if(!month) return;
    const head=g[hr];
    const cols=[]; for(let c=0;c<head.length;c++){ const k=key(head[c]); if(c>1&&k&&!monthKey(head[c])) cols.push({c,label:txt(head[c]),k}); }
    const totals=[];
    for(let r=hr+1;r<next;r++){
      const a=txt(g[r][0]); if(!a||monthKey(a)||key(a)==='campin'||key(a)==='campaign') continue;
      const vals={}; cols.forEach(x=>vals[x.k]=g[r][x.c]);
      totals.push({campaign:a,vals});
    }
    out[month]={cols,totals,hasData: totals.some(t=>Object.values(t.vals).some(v=>!blank(v)))};
  });
  return out;
}

/* Insights / Projects tabs: row 1 = headers, column "Month" says which month the row belongs to */
function parseTable(g){
  if(!Array.isArray(g)||!g.length) return [];
  const hi=g.findIndex(r=>r.some(c=>key(c)==='month')); if(hi<0) return [];
  const h=g[hi].map(key);
  return g.slice(hi+1).map(r=>{const o={};h.forEach((k,i)=>{if(k) o[k]=txt(r[i]);});return o;}).filter(o=>monthKey(o.month));
}

/* ================= STATE ================= */
let WEEKS=[], MONTHLY={}, INSIGHTS=[], PROJECTS=[];
const S = { month: CONFIG.MONTHS[0], view:'month', week:0, tab:0, panel:'summary' };

async function fetchTab(tab){
  const r=await fetch(CONFIG.API+'?tab='+encodeURIComponent(tab)+'&t='+Date.now());
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(); if(j&&j.error) throw new Error(j.error); return j;
}
const CACHE_KEY='inbound_masterdeck_cache_v2';
function applyData(w,m,keepMonth,ins,prj){
  WEEKS=parseWeekly(w); MONTHLY=parseMonthly(m); INSIGHTS=parseTable(ins); PROJECTS=parseTable(prj);
  if(!keepMonth){
    const withData=CONFIG.MONTHS.filter(mo=>(MONTHLY[mo]&&MONTHLY[mo].hasData)||WEEKS.some(b=>b.month===mo&&b.hasData));
    if(withData.length) S.month=withData[withData.length-1];
  }
  render();
}
async function load(){
  const st=document.getElementById('status');
  // 1) show the last saved copy instantly (same browser), then refresh from the sheet
  let cached=null;
  try{ cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){}
  if(cached&&cached.w){ applyData(cached.w,cached.m,false,cached.i,cached.p); st.textContent='Updating from Google Sheet…'; }
  else st.textContent='Loading…';
  const errs=[];
  const [w,m,ins,prj]=await Promise.all([
    fetchTab(CONFIG.WEEKLY_TAB).catch(e=>{errs.push(CONFIG.WEEKLY_TAB+': '+e.message);return null;}),
    fetchTab(CONFIG.MONTHLY_TAB).catch(e=>{errs.push(CONFIG.MONTHLY_TAB+': '+e.message);return null;}),
    fetchTab(CONFIG.INSIGHTS_TAB).catch(()=>null),
    fetchTab(CONFIG.PROJECTS_TAB).catch(()=>null)
  ]);
  if(w||m){
    const W=w||(cached&&cached.w), M=m||(cached&&cached.m);
    applyData(W,M,!!cached,ins,prj);
    try{ localStorage.setItem(CACHE_KEY,JSON.stringify({w:W,m:M,i:ins,p:prj,at:Date.now()})); }catch(e){}
  } else if(!cached) render();
  st.textContent = errs.length ? 'Could not read: '+errs.join(' · ')
    : 'Live from Google Sheet · updated '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function visibleMonths(){ return CONFIG.MONTHS.filter(m=>CONFIG.ALWAYS_SHOW.includes(m)||(MONTHLY[m]&&MONTHLY[m].hasData)||WEEKS.some(b=>b.month===m&&b.hasData)); }
const weeksOf = m => WEEKS.filter(b=>b.month===m&&b.hasData);

/* ================= RENDER ================= */
function render(){
  const weeks=weeksOf(S.month);
  if(S.week>=weeks.length) S.week=0;

  document.getElementById('monthGroup').innerHTML=visibleMonths().map(m=>`<button class="pill ${m===S.month?'on':''}" data-m="${m}">${MONTH_NAMES[m]}</button>`).join('');
  document.querySelectorAll('#viewGroup .pill').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  const wg=document.getElementById('weekGroup');
  wg.style.display=S.view==='week'?'flex':'none';
  wg.innerHTML=weeks.length?weeks.map((b,i)=>`<button class="pill ${i===S.week?'on':''}" data-w="${i}">${esc(b.week||'Week '+(i+1))}</button>`).join(''):'<span class="empty" style="padding:6px 10px">No weekly data yet</span>';

  const wb=weeks[S.week];
  document.getElementById('title').textContent = 'Inbound Call Center Master Deck '+CONFIG.YEAR;

  document.getElementById('chartsRow').classList.toggle('monthmode',S.view==='month');
  if(S.view==='month'){ const mi=CONFIG.MONTHS.indexOf(S.month); renderKPIs(monthKpi(S.month), mi>0?monthKpi(CONFIG.MONTHS[mi-1]):null, 'vs previous month'); renderMonth(weeks); }
  else { renderKPIs(weekKpi(wb), weekKpi(prevWeekBlock()), 'vs previous week'); renderWeek(wb); }
  renderNotes();
}


/* ================= KPI CARDS =================
   Weekly: totals of the selected week vs the previous week.
   Monthly: totals of the month (Total rows) vs the previous month. */
function kpiTotals(list){ // list of {calls,wa,sl,csat} raw cells
  const n=list.map(x=>({calls:num(x.calls),wa:num(x.wa),sl:num(x.sl),csat:num(x.csat)}));
  const sum=f=>{const v=n.map(x=>x[f]).filter(v=>v!=null);return v.length?v.reduce((a,b)=>a+b,0):null;};
  const wavg=f=>{let s=0,w=0,c=0,t=0;n.forEach(x=>{if(x[f]==null)return;c++;t+=x[f];if(x.calls){s+=x[f]*x.calls;w+=x.calls;}});return w?s/w:(c?t/c:null);};
  const avg=f=>{const v=n.map(x=>x[f]).filter(v=>v!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  return {calls:sum('calls'),wa:sum('wa'),sl:wavg('sl'),csat:avg('csat')};
}
function weekKpi(b){ if(!b) return null; const i=k=>b.cols.findIndex(x=>x.k===k);
  return kpiTotals(b.rows.map(r=>({calls:r.cells[i('callsvolume')],wa:r.cells[i('whatsappvolume')],sl:r.cells[i('sl')],csat:r.cells[i('csat')]}))); }
function monthKpi(m){ const M=MONTHLY[m]; if(!M||!M.hasData) return null;
  return kpiTotals(M.totals.map(t=>({calls:t.vals.callsvolume,wa:t.vals.whatsappvolume,sl:t.vals.sl,csat:t.vals.csat}))); }
function renderKPIs(cur,prev,label){
  const fN=v=>v==null?'–':Math.round(v).toLocaleString('en-US'), fP=v=>v==null?'–':Math.round(v)+'%';
  const items=[['Total Calls','calls',fN],['WhatsApp','wa',fN],['SL','sl',fP],['CSAT','csat',fP]];
  document.getElementById('kpis').innerHTML=items.map(([l,k,f])=>{
    const c=cur?cur[k]:null, p=prev?prev[k]:null;
    let d=`<div class="dlt">${label}: –</div>`;
    if(c!=null&&p!=null&&p!==0){
      const isPct=f===fP, diff=isPct?c-p:(c-p)/p*100, r=Math.round(diff);
      d=`<div class="dlt ${r>0?'up':r<0?'down':''}">${r>0?'▲':r<0?'▼':''} ${Math.abs(r)}${isPct?' pts':'%'} ${label}</div>`;
    }
    return `<div class="card kpi"><div class="lbl">${l}</div><div class="val">${f(c)}</div>${d}</div>`;
  }).join('');
}
function prevWeekBlock(){
  const ws=weeksOf(S.month); if(S.week>0) return ws[S.week-1];
  const mi=CONFIG.MONTHS.indexOf(S.month); if(mi>0){ const pw=weeksOf(CONFIG.MONTHS[mi-1]); return pw[pw.length-1]||null; } return null;
}

/* bar chart: values exactly as in the sheet (label shows the cell text) */
function barChart(items,color){
  const vals=items.map(i=>num(i.raw));
  if(!vals.some(v=>v!=null)) return '<p class="empty">No data yet.</p>';
  const W=640,H=210,pl=10,pb=34,pt=22, max=Math.max(1,...vals.filter(v=>v!=null));
  const slot=(W-pl)/items.length, bw=Math.min(70,slot*.6);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">`+items.map((it,i)=>{
    const v=vals[i]||0, h=(H-pt-pb)*v/max, cx=pl+slot*i+slot/2;
    return `<rect x="${cx-bw/2}" y="${H-pb-h}" width="${bw}" height="${h}" rx="5" fill="${color}"/>
      <text x="${cx}" y="${H-pb-h-6}" text-anchor="middle" style="fill:#1E2430;font-weight:600">${show(it.raw)}</text>
      ${lbl(it.label,cx,H-14)}`;
  }).join('')+'</svg>';
}
function csatBars(items){
  const r=items;
  return r.length?r.map(i=>`<div class="row"><span>${esc(i.label)}</span><div class="track"><div class="fill" style="width:${Math.min(100,num(i.raw)||0)}%"></div></div><b>${show(i.raw)||'-'}</b></div>`).join(''):'<p class="empty">No CSAT yet.</p>';
}
const short = n => n;
const lbl = (n,x,y) => { const w=String(n).split(' '); if(w.length<2) return `<text x="${x}" y="${y}" text-anchor="middle">${esc(n)}</text>`; return `<text x="${x}" y="${y-7}" text-anchor="middle"><tspan x="${x}">${esc(w[0])}</tspan><tspan x="${x}" dy="13">${esc(w.slice(1).join(' '))}</tspan></text>`; };

// every campaign: from the monthly Total rows + the weekly tab (so empty ones still show)
function allCampaigns(M,weeks){
  const list=[]; const add=c=>{ if(c&&!list.includes(c)) list.push(c); };
  WEEKS.filter(b=>b.month===S.month).forEach(b=>b.rows.forEach(r=>add(r.campaign)));
  if(M) M.totals.forEach(t=>add(t.campaign));
  if(!list.length) WEEKS.forEach(b=>b.rows.forEach(r=>add(r.campaign)));
  return list;
}
const BANDS={'Calls':'band-calls','WhatsApp':'band-wa','Tickets & Bookings':'band-tb','Customer Experience':'band-cx','Other':'band-cx'};


/* Tickets vs Calls: horizontal bars, numbers shown next to each bar */
function tvcChart(rows){
  const RED=getComputedStyle(document.documentElement).getPropertyValue('--red').trim()||'#D9444A', GR='#C9D2E0';
  const max=Math.max(1,...rows.map(r=>num(r.calls)||0));
  const body=rows.map(r=>{
    const calls=num(r.calls), tk=num(r.tickets);
    let pct=blank(r.pct)?'':txt(r.pct);
    if(!pct&&calls&&tk!=null) pct=Math.round(tk/calls*100)+'%';
    const bar=(v,raw,col,tc)=>v==null?'':`<div class="tb" style="width:${Math.max(.6,v/max*78)}%;background:${col}"><span style="color:${tc}">${show(raw)}</span></div>`;
    return `<div class="tvc-row"><span class="tvc-n">${esc(r.c)}</span><div class="tvc-bars">${bar(calls,r.calls,GR,'#3a4458')}${bar(tk,r.tickets,RED,RED)}</div><span class="tvc-p">${pct?esc(pct):'-'}</span></div>`;
  }).join('');
  return body+`<div class="legend"><span><i class="dot" style="background:${GR}"></i>Calls</span><span><i class="dot" style="background:${RED}"></i>Tickets</span><span style="color:${RED}">% = Tickets ÷ Calls</span></div>`;
}

function renderMonth(weeks){
  const M=MONTHLY[S.month], el=document.getElementById('table'), tabs=document.getElementById('tabs');
  tabs.innerHTML='';
  document.getElementById('tableTitle').textContent='Campaigns · '+MONTH_NAMES[S.month];
  const camps=allCampaigns(M,weeks);
  const tot=c=>M?(M.totals.find(t=>t.campaign===c)||null):null;

  // Tickets vs Calls (from the Total row of each campaign)
  document.getElementById('chartTitle').textContent='Tickets vs Calls';
  document.getElementById('chart').innerHTML = tvcChart(camps.map(c=>{const t=tot(c);return {c,calls:t?t.vals.callsvolume:'',tickets:t?(t.vals.tickets??''):'',pct:t?(t.vals.ticketsvscalls??''):''};}));

  // CSAT from the Total row
  document.getElementById('csatTitle').textContent='CSAT by campaign';
  document.getElementById('csat').innerHTML = csatBars(camps.map(c=>({label:c,raw:tot(c)?tot(c).vals.csat:''})));

  if(!M||!M.hasData){ el.innerHTML='<p class="empty">No monthly data for this month yet.</p>'; return; }
  const groups=MONTH_GROUPS.map(([name,keys])=>[name,M.cols.filter(c=>keys.includes(c.k))]).filter(g=>g[1].length);
  const used=new Set(groups.flatMap(g=>g[1].map(c=>c.k)));
  const other=M.cols.filter(c=>!used.has(c.k)); if(other.length) groups.push(['Other',other]);
  const n=camps.length+1;
  el.innerHTML=`<table class="mtable"><tr><th></th>${camps.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`+
    groups.map(([name,cols])=>`<tr class="band ${BANDS[name]||''}"><td colspan="${n}">${esc(name)}</td></tr>`+
      cols.map(c=>`<tr><td>${esc(c.label)}</td>${camps.map(cp=>{const t=tot(cp); const v=t?t.vals[c.k]:''; return `<td>${c.k==='csat'&&!blank(v)?'<b>'+show(v)+'</b>':(show(v)||'-')}</td>`;}).join('')}</tr>`).join('')
    ).join('')+'</table>';
}

function renderNotes(){
  const wrap=document.getElementById('monthlyOnly'), tabs=document.getElementById('panelTabs'), card=document.getElementById('tableCard');
  if(S.view!=='month'){ tabs.style.display='none'; wrap.style.display='none'; card.style.display='block'; return; }
  tabs.style.display='flex';
  tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.p===S.panel));
  const showIns=S.panel==='insights';
  card.style.display=showIns?'none':'block';
  wrap.style.display=showIns?'block':'none';
  if(!showIns) return;
  const rows=INSIGHTS.filter(r=>monthKey(r.month)===S.month);
  const ins=rows.map(r=>r.keyinsights||r.insights||r.insight).filter(Boolean);
  const chl=rows.map(r=>r.challenges||r.challenge).filter(Boolean);
  const prj=PROJECTS.filter(r=>monthKey(r.month)===S.month&&(r.project||r.company));
  const ul=a=>a.length?'<ul>'+a.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'<p class="empty">-</p>';
  document.getElementById('insights').innerHTML=ul(ins);
  document.getElementById('challenges').innerHTML=ul(chl);
  document.getElementById('notesWrap').style.display='grid';
  document.getElementById('projectsWrap').style.display='block';
  document.getElementById('projectsWrap').classList.add('mt14');
  document.getElementById('projects').innerHTML=prj.length?`<table><tr><th>Company</th><th>Project</th><th>Owner</th><th>Status</th><th>Completion Date</th><th>Expected Impact</th></tr>`+
    prj.map(r=>`<tr><td>${esc(r.company)}</td><td>${esc(r.project)}</td><td>${esc(r.owner)}</td><td><span class="badge">${esc(r.status)}</span></td><td>${esc(r.completiondate||r.date)}</td><td>${esc(r.expectedimpact||r.impact)}</td></tr>`).join('')+'</table>'
    :'<p class="empty">No projects for this month.</p>';
}

function renderWeek(b){
  const el=document.getElementById('table'), tabs=document.getElementById('tabs'); tabs.innerHTML='';
  document.getElementById('tableTitle').textContent='Campaigns · '+(b&&b.week?b.week:'');
  if(!b){ el.innerHTML='<p class="empty">No weekly data for this month yet.</p>';
    document.getElementById('chart').innerHTML=''; document.getElementById('csat').innerHTML=''; return; }
  const idx=k=>b.cols.findIndex(x=>x.k===k);
  document.getElementById('chartTitle').textContent='Calls Volume · '+b.week;
  document.getElementById('chart').innerHTML=barChart(b.rows.map(r=>({label:short(r.campaign),raw:r.cells[idx('callsvolume')]})),'#D9444A');
  document.getElementById('csatTitle').textContent='CSAT · '+b.week;
  document.getElementById('csat').innerHTML=csatBars(b.rows.map(r=>({label:r.campaign,raw:r.cells[idx('csat')]})));
  const vis=b.cols.map((c,i)=>i).filter(i=>b.rows.some(r=>!blank(r.cells[i])));   // skip columns that are empty for the whole week
  el.innerHTML=`<table><tr><th>Campaign</th>${vis.map(i=>`<th>${esc(b.cols[i].label)}</th>`).join('')}</tr>`+
    b.rows.map(r=>`<tr><td>${esc(r.campaign)}</td>${vis.map(i=>{const v=r.cells[i];return `<td>${b.cols[i].k==='csat'&&!blank(v)?'<b>'+show(v)+'</b>':(show(v)||'-')}</td>`;}).join('')}</tr>`).join('')+'</table>';
}

/* grouped bars: campaigns on x, one bar per week; labels = cell text */
function groupedChart(camps,series){
  const W=640,H=230,pb=34,pt=24,pl=6;
  const all=series.flatMap(s=>s.vals.map(num)).filter(v=>v!=null); if(!all.length) return '<p class="empty">No data yet.</p>';
  const max=Math.max(1,...all), shades=['#F4CBCC','#ECA2A4','#E27377','#D9444A','#BF3C41'];
  const slot=(W-pl)/camps.length, bw=Math.min(22,(slot*.8)/series.length);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  camps.forEach((c,ci)=>{
    const x0=pl+slot*ci+(slot-bw*series.length)/2;
    series.forEach((s,si)=>{ const v=num(s.vals[ci]); if(v==null) return; const h=(H-pt-pb)*v/max, x=x0+si*bw;
      svg+=`<rect x="${x}" y="${H-pb-h}" width="${bw-2}" height="${h}" rx="3" fill="${shades[si%shades.length]}"><title>${esc(c)} · ${esc(s.label)}: ${esc(txt(s.vals[ci]))}</title></rect>`; });
    svg+=lbl(c,pl+slot*ci+slot/2,H-14);
  });
  svg+='</svg><div class="legend">'+series.map((s,si)=>`<span><i class="dot" style="background:${shades[si%shades.length]}"></i>${esc(s.label)}</span>`).join('')+'</div>';
  return svg;
}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-m]'), v=e.target.closest('[data-v]'), w=e.target.closest('[data-w]'), t=e.target.closest('[data-t]');
  if(m){ S.month=m.dataset.m; S.week=0; S.tab=0; }
  else if(v){ S.view=v.dataset.v; }
  else if(w){ S.week=+w.dataset.w; S.view='week'; }
  else if(t){ S.tab=+t.dataset.t; }
  else if(e.target.closest('[data-p]')){ S.panel=e.target.closest('[data-p]').dataset.p; }
  else return;
  render();
});
load();
</script>
