<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbound Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E30613; --red-bg:#FDECEC; --navy:#1F3A5F; --navy-bg:#E8F0FA;
  --green:#127A4B; --green-bg:#E3F4EC; --amber:#9A6200; --amber-bg:#FFF3DC;
  --gray-bg:#F1F1F1; --text:#1E2430; --muted:#6B7280; --line:#E5E7EB; --card:#FFFFFF; --page:#F6F7F9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 40px}
.topbar{height:6px;background:var(--red)}
h1,h2,h3{font-family:'Crimson Pro',Georgia,serif;color:var(--navy);margin:0}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 0 12px;flex-wrap:wrap}
.eyebrow{color:var(--muted);font-family:'Crimson Pro',serif;font-size:18px}
h1{font-size:32px;font-weight:700;line-height:1.1}
.logo{height:46px}
.logo-txt{font-weight:800;font-style:italic;color:var(--red);font-size:24px;letter-spacing:.5px}
.filters{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.filters .group{flex-wrap:wrap;justify-content:center}
#monthGroup .pill{padding:9px 22px;font-size:14px}
#viewGroup{border-radius:20px}#viewGroup .pill{border-radius:16px;padding:6px 18px}
#viewGroup .pill.on{background:var(--navy)}
.group{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.pill{border:0;background:transparent;padding:7px 14px;border-radius:7px;font:inherit;font-size:13px;color:var(--text);cursor:pointer}
.pill:hover{background:var(--gray-bg)}
.pill.on{background:var(--red);color:#fff}
.pill .d{font-size:11px;opacity:.75;margin-left:4px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.half{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:20px;margin-bottom:10px}
.kpi .lbl{color:var(--muted);font-size:12px}
.kpi .val{font-size:26px;font-weight:600;color:var(--navy);margin:2px 0}
.kpi .dlt{font-size:12px;color:var(--muted)}
.up{color:var(--green)!important}.down{color:var(--red)!important}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.head h2{margin:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:7px;font:inherit;font-size:12px;cursor:pointer}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th{font-family:'Crimson Pro',serif;font-size:15px;color:var(--navy);font-weight:700;padding:10px 6px;text-align:center;border-bottom:2px solid var(--navy)}
td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td:first-child{font-family:'Crimson Pro',serif;font-size:15px;font-weight:700;color:#3a4458}
tr:nth-child(even) td{background:#FAFAFB}
th.wa{background:var(--green-bg);color:var(--green)}
.bad{color:var(--red);font-weight:600}.good{color:var(--green);font-weight:600}
.box{border-radius:12px;padding:16px;min-height:120px}
.box h2{font-size:20px;margin-bottom:8px}
.box ul{margin:0;padding-left:18px;line-height:1.8}
.ins{background:var(--navy-bg)}.ins h2{color:var(--navy)}
.chl{background:var(--red-bg)}.chl h2{color:#B3121B}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;background:var(--gray-bg)}
.b-prog{background:var(--amber-bg);color:var(--amber)}.b-done{background:var(--green-bg);color:var(--green)}.b-late{background:var(--red-bg);color:var(--red)}
.empty{color:var(--muted);font-size:13px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bars .row{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bars .track{background:var(--gray-bg);border-radius:4px;height:12px}
.bars .fill{background:var(--red);height:12px;border-radius:4px}
svg text{font-family:Inter,sans-serif;font-size:11px;fill:var(--muted)}
.wbar{cursor:pointer}
.status{font-size:12px;color:var(--muted);text-align:right;margin-top:10px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.half{grid-template-columns:1fr}h1{font-size:26px}}
</style>
</head>

];
const SAMPLE_NOTES = [ ['Month','Type','Text'] ];
const SAMPLE_PROJECTS = [
  ['Month','Company','Project','Owner','Status','Due','Impact'],
  ['Sep','Nissan','WhatsApp SLA workflow','Team Lead','In Progress','15 Oct 2026','Cut Avg First RT to <5 min']
];

/* ================= HELPERS ================= */
const key = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function num(v){ if(v===null||v===undefined||v==='') return null; const n = Number(String(v).replace(/[,%\s]/g,'')); return isNaN(n)?null:n; }
function pct(v){ if(v===''||v==null) return null; const s=String(v); let n=num(s); if(n===null) return null; if(!s.includes('%') && n>0 && n<=1) n*=100; return n; }
function secs(v){
  if(v===''||v==null) return null; const s=String(v).trim();
  if(s.includes(':')){ const p=s.split(':').map(Number); if(p.some(isNaN)) return null; return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]; }
  const m=s.match(/^([\d.]+)\s*min/i); if(m) return Math.round(parseFloat(m[1])*60);
  const n=Number(s); if(isNaN(n)) return null; return n<1?Math.round(n*86400):n;
}
const pad=n=>String(n).padStart(2,'0');
function fT(s){ if(s==null) return '–'; s=Math.round(s); return Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60); }
function fP(n){ return n==null?'–':Math.round(n)+'%'; }
function fN(n){ return n==null?'–':Math.round(n).toLocaleString('en-US'); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f);rows.push(row);row=[];f=''; }
    else f+=c; }
  if(f||row.length){row.push(f);rows.push(row);} return rows.filter(r=>r.some(x=>x!==''));
}
function toObjects(table){
  const h=table[0].map(key); return table.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]??'');return o;});
}
function normalize(o){
  return {
    month:String(o.month||'').trim().slice(0,3), period:String(o.period||'').trim(), dates:o.dates||'', campaign:String(o.campaign||'').trim(),
    calls:num(o.calls), answered:pct(o.answered), sl:pct(o.sl), asa:secs(o.asa), aht:secs(o.aht), acw:secs(o.acw),
    abandon:pct(o.abandon), wa:num(o.whatsapp), frt:secs(o.firstrt), art:secs(o.avgrt),
    reconnected:num(o.reconnected), tickets:num(o.tickets), bookings:num(o.bookings), bookingsRaw:o.bookings, csat:pct(o.csat)
  };
}

/* ================= STATE ================= */
let DATA=[], NOTES=[], PROJECTS=[];
const S = { month: CONFIG.MONTHS[0], view:'month', week:null, tab:'calls' };

async function fetchTab(tab){
  const url=`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&headers=1`;
  const r=await fetch(url); if(!r.ok) throw new Error(tab); return parseCSV(await r.text());
}
async function load(){
  const st=document.getElementById('status');
  if(CONFIG.SHEET_ID){
    try{
      const [d,n,p]=await Promise.all([fetchTab(CONFIG.DATA_TAB),fetchTab(CONFIG.NOTES_TAB).catch(()=>[['Month','Type','Text']]),fetchTab(CONFIG.PROJECTS_TAB).catch(()=>[['Month']])]);
      DATA=toObjects(d).map(normalize); NOTES=toObjects(n); PROJECTS=toObjects(p);
      st.textContent='Live from Google Sheet · updated '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    }catch(e){ useSample(); st.textContent='Could not read the sheet. Showing sample data.'; }
  } else { useSample(); st.textContent='Sample data · connect a Google Sheet in CONFIG.SHEET_ID'; }
  DATA=DATA.filter(r=>r.month&&r.campaign);
  // open on the latest month that has data
  const withData=CONFIG.MONTHS.filter(m=>DATA.some(r=>r.month===m)); if(withData.length) S.month=withData[withData.length-1];
  render();
}
function useSample(){ DATA=toObjects([DATA_HEADERS,...SAMPLE_DATA]).map(normalize); NOTES=toObjects(SAMPLE_NOTES); PROJECTS=toObjects(SAMPLE_PROJECTS); }

/* ================= DATA ACCESS ================= */
const weeksOf = m => [...new Set(DATA.filter(r=>r.month===m&&/^w\d/i.test(r.period)).map(r=>r.period.toUpperCase()))].sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1)));
const datesOf = (m,w) => (DATA.find(r=>r.month===m&&r.period.toUpperCase()===w&&r.dates)||{}).dates||'';

function wavg(rows,f){ let s=0,w=0,c=0,t=0; rows.forEach(r=>{ if(r[f]==null) return; c++; t+=r[f]; if(r.calls){ s+=r[f]*r.calls; w+=r.calls; } }); return w?s/w:(c?t/c:null); }
function sum(rows,f){ const v=rows.map(r=>r[f]).filter(x=>x!=null); return v.length?v.reduce((a,b)=>a+b,0):null; }
function avg(rows,f){ const v=rows.map(r=>r[f]).filter(x=>x!=null); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; }

function aggregate(rows,campaign){
  return { campaign, calls:sum(rows,'calls'), wa:sum(rows,'wa'), tickets:sum(rows,'tickets'), bookings:sum(rows,'bookings'), reconnected:sum(rows,'reconnected'),
    answered:wavg(rows,'answered'), sl:wavg(rows,'sl'), asa:wavg(rows,'asa'), aht:wavg(rows,'aht'), acw:wavg(rows,'acw'),
    abandon:avg(rows,'abandon'), frt:avg(rows,'frt'), art:avg(rows,'art'), csat:avg(rows,'csat'), bookingsRaw:rows.length===1?rows[0].bookingsRaw:'' };
}
// one row per campaign for a month (uses the "Month" row, falls back to adding up the weeks)
function periodRows(m,p){
  return CONFIG.CAMPAIGNS.map(c=>{
    let rows=DATA.filter(r=>r.month===m&&r.campaign.toLowerCase()===c.toLowerCase()&&r.period.toUpperCase()===p.toUpperCase());
    if(!rows.length&&p==='Month') rows=DATA.filter(r=>r.month===m&&r.campaign.toLowerCase()===c.toLowerCase()&&/^w\d/i.test(r.period));
    return rows.length?aggregate(rows,c):{campaign:c,empty:true};
  });
}
function totals(rows){ const r=rows.filter(x=>!x.empty); return { calls:sum(r,'calls'), wa:sum(r,'wa'), sl:wavg(r,'sl'), answered:wavg(r,'answered'), bookings:sum(r,'bookings'), csat:avg(r,'csat') }; }

function previous(){
  const mi=CONFIG.MONTHS.indexOf(S.month);
  if(S.view==='month') return mi>0?{m:CONFIG.MONTHS[mi-1],p:'Month'}:null;
  const ws=weeksOf(S.month), wi=ws.indexOf(S.week);
  if(wi>0) return {m:S.month,p:ws[wi-1]};
  if(mi>0){ const pw=weeksOf(CONFIG.MONTHS[mi-1]); if(pw.length) return {m:CONFIG.MONTHS[mi-1],p:pw[pw.length-1]}; }
  return null;
}

/* ================= RENDER ================= */
function render(){
  const weeks=weeksOf(S.month);
  if(S.view==='week'&&!weeks.includes(S.week)) S.week=weeks[weeks.length-1]||null;
  const period=S.view==='month'?'Month':S.week;

  // filters
  document.getElementById('monthGroup').innerHTML=CONFIG.MONTHS.map(m=>`<button class="pill ${m===S.month?'on':''}" data-m="${m}">${MONTH_NAMES[m]}</button>`).join('');
  document.querySelectorAll('#viewGroup .pill').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  const wg=document.getElementById('weekGroup');
  wg.style.display=S.view==='week'?'flex':'none';
  wg.innerHTML=weeks.length?weeks.map(w=>`<button class="pill ${w===S.week?'on':''}" data-w="${w}">${w}${datesOf(S.month,w)?`<span class="d">${esc(datesOf(S.month,w))}</span>`:''}</button>`).join(''):'<span class="empty" style="padding:6px 10px">No weekly data yet</span>';

  const full=MONTH_NAMES[S.month]+' '+CONFIG.YEAR;
  document.getElementById('title').textContent = S.view==='month' ? 'Monthly Inbound Summary · '+full
    : 'Weekly Inbound Summary · '+MONTH_NAMES[S.month]+' '+(S.week||'')+(S.week&&datesOf(S.month,S.week)?' ('+datesOf(S.month,S.week)+')':'');

  const rows=period?periodRows(S.month,period):CONFIG.CAMPAIGNS.map(c=>({campaign:c,empty:true}));
  renderKPIs(rows);
  renderChart(weeks);
  renderCSAT(rows);
  renderTable(rows);
  document.getElementById('monthlyOnly').style.display=S.view==='month'?'block':'none';
  if(S.view==='month') renderNotes();
}

function renderKPIs(rows){
  const t=totals(rows), pv=previous(), p=pv?totals(periodRows(pv.m,pv.p)):null;
  const label=S.view==='month'?'vs previous month':'vs previous week';
  const items = S.view==='month'
    ? [['Calls','calls',fN],['WhatsApp','wa',fN],['Service level','sl',fP],['Bookings','bookings',fN],['CSAT','csat',fP]]
    : [['Calls','calls',fN],['Answered','answered',fP],['Service level','sl',fP],['WhatsApp','wa',fN],['CSAT','csat',fP]];
  document.getElementById('kpis').innerHTML=items.map(([l,k,f])=>{
    let d=`<div class="dlt">${label}: –</div>`;
    if(p&&t[k]!=null&&p[k]!=null&&p[k]!==0){
      const isPct=f===fP, diff=isPct?t[k]-p[k]:(t[k]-p[k])/p[k]*100;
      const cls=diff>0?'up':diff<0?'down':'';
      d=`<div class="dlt ${cls}">${diff>0?'▲':diff<0?'▼':''} ${Math.abs(Math.round(diff))}${isPct?' pts':'%'} ${label}</div>`;
    }
    return `<div class="card kpi"><div class="lbl">${l}</div><div class="val">${f(t[k])}</div>${d}</div>`;
  }).join('');
}

function renderChart(weeks){
  const el=document.getElementById('chart');
  if(!weeks.length){ el.innerHTML='<p class="empty">Weekly rows for this month will appear here.</p>'; return; }
  const W=640,H=200,pl=44,pb=28,pt=12;
  const data=weeks.map(w=>totals(periodRows(S.month,w)));
  if(S.view==='month'){
    document.getElementById('chartTitle').textContent='Calls vs WhatsApp by week';
    const max=Math.max(1,...data.map(d=>Math.max(d.calls||0,d.wa||0)));
    const x=i=>weeks.length===1?(pl+W)/2:pl+i*(W-pl-20)/(weeks.length-1);
    const y=v=>pt+(H-pt-pb)*(1-v/max);
    const line=(k,c)=>{ const pts=data.map((d,i)=>d[k]==null?null:[x(i),y(d[k])]).filter(Boolean);
      return `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${c}"/>`).join(''); };
    const grid=[0,.5,1].map(f=>`<line x1="${pl}" x2="${W}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="#E5E7EB"/><text x="${pl-6}" y="${y(max*f)+4}" text-anchor="end">${fN(max*f)}</text>`).join('');
    el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%">${grid}${line('calls','#1F3A5F')}${line('wa','#E30613')}${weeks.map((w,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${w}</text>`).join('')}</svg>
      <div class="legend"><span><i class="dot" style="background:#1F3A5F"></i>Calls</span><span><i class="dot" style="background:#E30613"></i>WhatsApp</span></div>`;
  } else {
    document.getElementById('chartTitle').textContent='Calls per week · '+MONTH_NAMES[S.month];
    const max=Math.max(1,...data.map(d=>d.calls||0)), slot=(W-pl)/weeks.length, bw=Math.min(90,slot*.6);
    el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%">`+weeks.map((w,i)=>{
      const v=data[i].calls||0, h=(H-pt-pb-14)*v/max, cx=pl+slot*i+slot/2, on=w===S.week;
      return `<g class="wbar" data-w="${w}"><rect x="${cx-bw/2}" y="${H-pb-h}" width="${bw}" height="${h}" rx="5" fill="${on?'#E30613':'#D5DCE6'}"/>
        <text x="${cx}" y="${H-pb-h-5}" text-anchor="middle" style="fill:${on?'#E30613':'#6B7280'};font-weight:600">${fN(v)}</text>
        <text x="${cx}" y="${H-8}" text-anchor="middle">${w}</text></g>`;
    }).join('')+`</svg><div class="legend">Click a bar to open that week</div>`;
  }
}

function renderCSAT(rows){
  const r=rows.filter(x=>!x.empty&&x.csat!=null).sort((a,b)=>b.csat-a.csat);
  document.getElementById('csat').innerHTML=r.length?r.map(x=>`<div class="row"><span>${esc(x.campaign)}</span><div class="track"><div class="fill" style="width:${Math.min(100,x.csat)}%;background:${x.csat>=CONFIG.RULES.csatGood?'#127A4B':x.csat<CONFIG.RULES.csatBad?'#E30613':'#1F3A5F'}"></div></div><b>${fP(x.csat)}</b></div>`).join(''):'<p class="empty">No CSAT yet.</p>';
}

function mark(k,v){
  const R=CONFIG.RULES; if(v==null) return '';
  if(k==='csat') return v>=R.csatGood?'good':v<R.csatBad?'bad':'';
  if(k==='answered') return v<R.answeredBad?'bad':'';
  if(k==='abandon') return v>=R.abandonBad?'bad':'';
  return '';
}

const MONTH_TABS = {
  calls:['Calls',[['Calls Volume','calls',fN],['SL%','sl',fP],['Speed of Answer','asa',fT],['Abandoned Rate','abandon',fP],['Avg. AHT','aht',fT],['Avg. ACW','acw',fT]]],
  wa:['WhatsApp',[['WhatsApp Volume','wa',fN],['Avg. First RT','frt',fT],['Avg. RT','art',fT],['Reconnected','reconnected',fN]]],
  tb:['Tickets & Bookings',[['Tickets','tickets',fN],['Tickets vs Calls','tvc',fP],['Bookings','bookings',fN]]],
  cx:['Customer Experience',[['CSAT','csat',fP]]]
};

function renderTable(rows){
  const tabs=document.getElementById('tabs'), el=document.getElementById('table');
  if(S.view==='month'){
    document.getElementById('tableTitle').textContent='Campaigns · '+MONTH_NAMES[S.month];
    tabs.innerHTML=Object.entries(MONTH_TABS).map(([k,[l]])=>`<button class="tab ${k===S.tab?'on':''}" data-t="${k}">${l}</button>`).join('');
    const metrics=MONTH_TABS[S.tab][1];
    rows.forEach(r=>{ r.tvc=(r.tickets!=null&&r.calls)?r.tickets/r.calls*100:null; });
    el.innerHTML=`<table><tr><th></th>${rows.map(r=>`<th>${esc(r.campaign)}</th>`).join('')}</tr>`+
      metrics.map(([l,k,f])=>`<tr><td>${l}</td>${rows.map(r=>{
        let v=r[k]; let txt=f(v);
        if(k==='bookings'&&v==null&&r.bookingsRaw) txt=esc(r.bookingsRaw);
        return `<td class="${mark(k,v)}">${r.empty?'–':txt}</td>`;}).join('')}</tr>`).join('')+'</table>';
  } else {
    document.getElementById('tableTitle').textContent='Campaigns · '+(S.week||'');
    tabs.innerHTML='';
    const cols=[['Calls Volume','calls',fN],['Answered%','answered',fP],['SL %','sl',fP],['ASA','asa',fT],['AHT','aht',fT],['CSAT','csat',fP],['WhatsApp Volume','wa',fN,1],['Abandon%','abandon',fP,1],['Avg. First RT','frt',fT,1]];
    el.innerHTML=`<table><tr><th>Campaign</th>${cols.map(c=>`<th class="${c[3]?'wa':''}">${c[0]}</th>`).join('')}</tr>`+
      rows.map(r=>`<tr><td>${esc(r.campaign)}</td>${cols.map(([l,k,f])=>`<td class="${mark(k,r[k])}">${r.empty?'':(k==='csat'&&r[k]!=null?'<b>'+f(r[k])+'</b>':f(r[k]))}</td>`).join('')}</tr>`).join('')+'</table>';
  }
}

function renderNotes(){
  const n=NOTES.filter(x=>String(x.month).slice(0,3)===S.month&&x.text);
  const list=t=>{ const i=n.filter(x=>key(x.type).startsWith(t)); return i.length?'<ul>'+i.map(x=>`<li>${esc(x.text)}</li>`).join('')+'</ul>':'<p class="empty">Nothing added for this month.</p>'; };
  document.getElementById('insights').innerHTML=list('insight');
  document.getElementById('challenges').innerHTML=list('challenge');
  const p=PROJECTS.filter(x=>String(x.month).slice(0,3)===S.month&&x.project);
  const badge=s=>{ const k=key(s); const c=k.includes('progress')?'b-prog':k.includes('done')||k.includes('complete')?'b-done':k.includes('delay')||k.includes('late')?'b-late':''; return `<span class="badge ${c}">${esc(s||'–')}</span>`; };
  document.getElementById('projects').innerHTML=p.length?`<table><tr><th>Company</th><th>Project</th><th>Owner</th><th>Status</th><th>Completion Date</th><th>Expected Impact</th></tr>`+
    p.map(x=>`<tr><td>${esc(x.company)}</td><td>${esc(x.project)}</td><td>${esc(x.owner)}</td><td>${badge(x.status)}</td><td>${esc(x.due)}</td><td>${esc(x.impact)}</td></tr>`).join('')+'</table>'
    :'<p class="empty">No projects for this month.</p>';
}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-m]'), v=e.target.closest('[data-v]'), w=e.target.closest('[data-w]'), t=e.target.closest('[data-t]');
  if(m){ S.month=m.dataset.m; S.week=null; }
  else if(v){ S.view=v.dataset.v; }
  else if(w){ S.week=w.dataset.w; S.view='week'; }
  else if(t){ S.tab=t.dataset.t; }
  else return;
  render();
});
load();
</script>
